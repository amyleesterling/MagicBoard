<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sophia and Cora's SFX Website</title>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    
    <style>
        body {
            /* Nature Methods inspired gradient */
            background: linear-gradient(135deg, #f14c93, #a64ca6, #4c82c1, #36a9e1);
            background-size: 400% 400%;
            min-height: 100vh; 
            margin: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            font-family: 'Comic Sans MS', sans-serif; 
            color: white;
            transition: 0.5s;
            overflow: hidden; /* Prevents scrollbars from sparkles */
        }

        /* Drawing Canvas Layer */
        #drawing-board {
            position: fixed;
            top: 0; 
            left: 0;
            z-index: 1; /* Behind buttons */
            cursor: crosshair;
        }

        /* UI Layer - Keeps buttons clickable over the paint */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Allows clicks to pass through container */
        }

        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }

        /* Disco Animation */
        @keyframes disco {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .disco-mode {
            animation: disco 2s linear infinite;
        }

        /* Reactive Buttons */
        .btn {
            padding: 40px; 
            font-size: 50px; 
            margin: 15px; 
            cursor: pointer;
            border-radius: 30px; 
            border: none; 
            transition: 0.1s;
            box-shadow: 0 15px #00000033;
            pointer-events: auto;
        }

        .btn:active {
            transform: scale(0.8) rotate(5deg);
            box-shadow: 0 5px #00000033;
        }

        #fart-btn { background: #8B4513; }
        #woosh-btn { background: #36a9e1; }
        #meow-btn { background: #b817aa; }
        #unicorn-btn { background: #f339bb; }
        #baby-unicorn-btn { background: #fd17cb; }
        #disco-btn { background: #ffcc00; font-size: 25px; padding: 20px; }
        #clear-btn { background: white; color: black; font-size: 20px; padding: 15px; }
        
        #runaway-btn { 
            background: #ff4747; 
            transition: left 0.3s ease-out, top 0.3s ease-out; /* Smooth slide */
        }

        /* Sparkle Style */
        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: fadeOut 1s forwards;
            z-index: 15;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-50px); }
        }

        h1 {
            text-align: center;
            padding: 0 15px;
            font-size: 2em;
        }

        /* Mobile / small screens */
        @media (max-width: 600px) {
            h1 { font-size: 1.4em; }

            .btn {
                padding: 22px;
                font-size: 34px;
                margin: 8px;
                border-radius: 20px;
            }

            #disco-btn { font-size: 16px; padding: 14px; }
            #clear-btn { font-size: 14px; padding: 12px; }
        }

        /* Silly Champion Popup */
        #champ-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #champ-overlay.show { display: flex; }

        .champ-card {
            background: linear-gradient(160deg, #fff7d6, #ffe08a);
            color: #5a3d00;
            border: 6px dashed #d49a00;
            border-radius: 30px;
            padding: 30px 40px;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 20px 50px #00000055;
            transform: rotate(-2deg);
            animation: champ-pop 0.5s cubic-bezier(.2,1.6,.4,1) both;
        }

        @keyframes champ-pop {
            0% { transform: scale(0.3) rotate(12deg); opacity: 0; }
            100% { transform: scale(1) rotate(-2deg); opacity: 1; }
        }

        .champ-medal {
            font-size: 90px;
            line-height: 1;
            display: inline-block;
            animation: champ-swing 1.2s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes champ-swing {
            0%, 100% { transform: rotate(-12deg); }
            50% { transform: rotate(12deg); }
        }

        .champ-title {
            font-size: 34px;
            font-weight: bold;
            margin: 14px 0 6px;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #d49a00;
        }

        .champ-sub {
            font-size: 18px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .champ-btn {
            background: #d49a00;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 26px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px #a87a00;
        }
        .champ-btn:active { transform: translateY(4px); box-shadow: 0 2px #a87a00; }

        @media (max-width: 600px) {
            .champ-medal { font-size: 64px; }
            .champ-title { font-size: 24px; }
            .champ-sub { font-size: 15px; }
        }
    </style>
</head>
<body id="main-body">

    <canvas id="drawing-board"></canvas>

    <div id="champ-overlay" onclick="closeChamp(event)">
        <div class="champ-card">
            <div class="champ-medal">🥇</div>
            <div class="champ-title">FASTEST MOUSE MOVER IN THE WEST!</div>
            <div class="champ-sub">🤠 yeehaw, partner — ya caught the runnin' fella! 🏃‍♂️💨</div>
            <button class="champ-btn" onclick="closeChamp(event)">Heck yeah! 🎉</button>
        </div>
    </div>

    <div class="ui-layer">
        <h1>Sophia and Cora's Clickety Website</h1>
        
        <div class="btn-container">
            <button id="fart-btn" class="btn" onclick="megaEffect('fart', '💩')">💩</button>
            <button id="woosh-btn" class="btn" onclick="megaEffect('woosh', '☁️')">☁️</button>
            <button id="meow-btn" class="btn" onclick="megaEffect('meow', '🐱')">🐱</button>
            <button id="unicorn-btn" class="btn" onclick="megaEffect('unicorn', '🦄')">🦄</button>
            <button id="baby-unicorn-btn" class="btn" onclick="megaEffect('baby', '🦄')">🦄</button>
            <button id="runaway-btn" class="btn" onmouseenter="runAway(this)" ontouchstart="runAway(this)" onclick="caughtIt()">🏃‍♂️</button>
        </div>

        <div style="margin-top: 20px; pointer-events: auto;">
            <button id="disco-btn" class="btn" onclick="toggleDisco()">🕺 BACKGROUND REMIX 💃</button>
            <button id="clear-btn" class="btn" onclick="clearCanvas()">🗑️ CLEAR PAINT</button>
        </div>
    </div>

    <script>
        const jsConfetti = new JSConfetti();
        const canvas = document.getElementById('drawing-board');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        const sounds = {
            fart: new Audio('sfx/fart_1.mp3'),
            woosh: new Audio('sfx/woosh.mp3'),
            meow: new Audio('sfx/meow.mp3'),
            unicorn: new Audio('sfx/unicorn.mp3'),
            baby: new Audio('sfx/baby_unicorn.m4a'),
            win: new Audio('sfx/win.mp3') // Ensure win.mp3 is in sfx folder!
        };

        // 1. Drawing Board Setup
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            ctx.lineWidth = 15;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; // Glowy white paint
            ctx.lineTo(e.clientX, e.clientY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX, e.clientY);
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 2. The Runaway Button — dodges within the viewport, never off-screen
        function runAway(btn) {
            // Pin to the viewport so left/top are in screen coordinates and
            // clamping against window dimensions is correct.
            if (getComputedStyle(btn).position !== 'fixed') {
                const rect = btn.getBoundingClientRect();
                btn.style.position = 'fixed';
                btn.style.margin = '0';
                btn.style.left = rect.left + 'px';
                btn.style.top = rect.top + 'px';
            }

            const margin = 10; // keep a little gap from the edges
            const maxX = window.innerWidth - btn.offsetWidth - margin;
            const maxY = window.innerHeight - btn.offsetHeight - margin;

            const rect = btn.getBoundingClientRect();
            const maxOffset = 200; // hop a good distance away
            let x = rect.left + (Math.random() * 2 - 1) * maxOffset;
            let y = rect.top + (Math.random() * 2 - 1) * maxOffset;

            // clamp so the button always stays fully on the page
            x = Math.max(margin, Math.min(x, maxX));
            y = Math.max(margin, Math.min(y, maxY));

            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function caughtIt() {
            if(sounds.win) sounds.win.play();
            jsConfetti.addConfetti({
                emojis: ['🥇', '🤠', '⭐', '🏆'],
                emojiSize: 100,
                confettiNumber: 100
            });
            document.getElementById('champ-overlay').classList.add('show');
        }

        function closeChamp(event) {
            // Only close when clicking the dim backdrop or the button, not the card itself
            if (event.target.id === 'champ-overlay' || event.target.classList.contains('champ-btn')) {
                document.getElementById('champ-overlay').classList.remove('show');
            }
        }

        // 3. Disco Ceiling Shower
        let discoInterval;
        function toggleDisco() {
            const isDisco = document.getElementById('main-body').classList.toggle('disco-mode');
            if (isDisco) {
                discoInterval = setInterval(() => {
                    jsConfetti.addConfetti({ 
                        emojis: ['🌈', '✨', '🎈', '🎨'], 
                        confettiNumber: 20 
                    });
                }, 500);
            } else {
                clearInterval(discoInterval);
            }
        }

        // 4. Standard Effects
        function megaEffect(type, emoji) {
            if(sounds[type]) {
                sounds[type].currentTime = 0;
                sounds[type].play();
            }
            jsConfetti.addConfetti({ 
                emojis: [emoji, '✨', '⭐'], 
                emojiSize: 100, 
                confettiNumber: 40 
            });
        }

        // 5. Sparkle Trail
        document.addEventListener('mousemove', (e) => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✨';
            sparkle.style.left = e.pageX + 'px';
            sparkle.style.top = e.pageY + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1000);
        });
    </script>
</body>
</html>
